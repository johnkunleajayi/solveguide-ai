[package]
name = "solveguide-ai"
version = "0.1.0"
description = "SolveGuide AI desktop foundation"
edition = "2021"

[lib]
name = "solveguide_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
png = "0.18"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Win32_System_WinRT", "Win32_UI_HiDpi", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging"] }

